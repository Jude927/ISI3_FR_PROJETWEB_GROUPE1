<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #D59D80;
      --primary-soft: #F5E6DA;
      --accent-peach: #FFE5D9;
      --accent-cream: #FFF9F5;
      --bg-canvas: #FDFCFB;
      --sidebar-bg: #FFFFFF;
      --text-dark: #4A3F35;
    }
    
    body {
      font-family: 'Comfortaa', cursive;
      background: linear-gradient(135deg, var(--bg-canvas) 0%, var(--accent-cream) 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    #chatBox {
      background: white;
      border-radius: 24px;
      padding: 1.5rem;
      min-height: 100px;
      max-height: 150px;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(213, 157, 128, 0.15);
      border: 2px solid var(--accent-peach);
      background-image: 
        radial-gradient(circle at 20% 20%, var(--accent-cream) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, var(--primary-soft) 0%, transparent 50%);
    }
    
    #chatBox::-webkit-scrollbar {
      width: 8px;
    }
    
    #chatBox::-webkit-scrollbar-track {
      background: var(--accent-cream);
      border-radius: 10px;
    }
    
    #chatBox::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }
    
    select, textarea {
      font-family: 'Comfortaa', cursive;
      transition: all 0.3s ease;
    }
    
    select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(213, 157, 128, 0.1);
    }
    
    button {
      transition: all 0.3s ease;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(213, 157, 128, 0.3);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .decorative-circle {
      position: fixed;
      border-radius: 50%;
      opacity: 0.1;
      pointer-events: none;
      z-index: -1;
    }
    
    .circle-1 {
      width: 300px;
      height: 300px;
      background: var(--primary);
      top: -100px;
      right: -100px;
    }
    
    .circle-2 {
      width: 200px;
      height: 200px;
      background: var(--accent-peach);
      bottom: -50px;
      left: -50px;
    }

    .lang-switcher {
      display: flex;
      gap: 0.5rem;
      background: white;
      padding: 0.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(213, 157, 128, 0.1);
      border: 2px solid var(--accent-peach);
    }

    .lang-btn {
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-dark);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-btn:hover {
      background: var(--accent-cream);
      transform: translateY(0);
    }

    .lang-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(213, 157, 128, 0.3);
    }
  </style>
</head>
<body>

<div class="decorative-circle circle-1"></div>
<div class="decorative-circle circle-2"></div>

<div class="max-w-4xl mx-auto">
  
  <!-- Bouton de changement de langue -->
  <div class="flex justify-end mb-6">
    <div class="lang-switcher">
      <button class="lang-btn active" id="btnFr" onclick="changeLanguage('fr')">
        <span>🇫🇷</span>
        <span>Français</span>
      </button>
      <button class="lang-btn" id="btnEn" onclick="changeLanguage('en')">
        <span>🇬🇧</span>
        <span>English</span>
      </button>
    </div>
  </div>
 
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-[var(--primary)] to-[var(--primary-soft)] rounded-3xl shadow-lg mb-4">
      <span class="material-symbols-outlined text-white text-3xl">psychology</span>
    </div>
    <h2 class="text-3xl font-bold text-[var(--text-dark)] mb-2" data-translate="title">Chat IA pédagogique</h2>
    <p class="text-sm text-[var(--primary)]" data-translate="subtitle">Votre assistant d'apprentissage personnalisé</p>
  </div>

  <div id="chatBox" class="mb-6">
    <div class="flex items-center justify-center h-full text-gray-500">
      <div class="text-center">
        <span class="material-symbols-outlined text-6xl mb-3 text-[var(--primary-soft)]">chat</span>
        <p class="text-sm" data-translate="welcomeMsg">Commencez une conversation dans le cadre ci-joint...</p>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-3xl shadow-xl border-2 border-[var(--accent-peach)] p-6">
    <div class="flex gap-4 mb-6">
      
      <div class="flex-1">
        <label class="block text-sm font-semibold text-[var(--text-dark)] mb-2 flex items-center gap-2">
          <span class="material-symbols-outlined text-[var(--primary)] text-lg">category</span>
          <span data-translate="categoryLabel">Catégorie :</span>
        </label>
        <select id="category" class="w-full px-4 py-3 bg-[var(--accent-cream)] border-2 border-[var(--primary-soft)] rounded-2xl text-[var(--text-dark)] font-medium cursor-pointer">
          <option value="math" data-translate-option="math">Mathématiques</option>
          <option value="physics" data-translate-option="physics">Physique</option>
          <option value="svt" data-translate-option="svt">SVT</option>
          <option value="literature" data-translate-option="literature">Littérature Camerounaise</option>
          <option value="it" data-translate-option="it">Informatique</option>
        </select>
      </div>

      <!-- Pour attribuer la langue au code-->
      <div class="flex-1">
        <label class="block text-sm font-semibold text-[var(--text-dark)] mb-2 flex items-center gap-2">
          <span class="material-symbols-outlined text-[var(--primary)] text-lg">language</span>
          <span data-translate="languageLabel">Langue :</span>
        </label>
        <select id="language" class="w-full px-4 py-3 bg-[var(--accent-cream)] border-2 border-[var(--primary-soft)] rounded-2xl text-[var(--text-dark)] font-medium cursor-pointer">
          <option value="fr" data-translate-option="french">🇫🇷 Français</option>
          <option value="en" data-translate-option="english">🇬🇧 English</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-semibold text-[var(--text-dark)] mb-2 flex items-center gap-2">
        <span class="material-symbols-outlined text-[var(--primary)] text-lg">edit_note</span>
        <span data-translate="questionLabel">Votre question :</span>
      </label>
      <textarea 
        id="prompt" 
        data-translate-placeholder="questionPlaceholder"
        placeholder="Posez votre question ici..."
        class="w-full px-4 py-3 bg-[var(--accent-cream)] border-2 border-[var(--primary-soft)] rounded-2xl text-[var(--text-dark)] resize-none h-28 placeholder-gray-400"
      ></textarea>
    </div>

    <button 
      id="sendBtn"
      class="w-full bg-gradient-to-r from-[var(--primary)] to-[#C88A6E] text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 hover:shadow-xl"
    >
      <span class="material-symbols-outlined">send</span>
      <span data-translate="sendBtn">Envoyer</span>
    </button>
  </div>

  <div class="mt-6 text-center">
    <p class="text-xs text-gray-400 flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-sm">info</span>
      <span data-translate="footer">Votre compagnon DeepSeek AI pour vous aider dans vos études.</span>
    </p>
  </div>
</div>

<script>
  // Dictionnaire de traductions
  const translations = {
    fr: {
      title: "Chat IA pédagogique",
      subtitle: "Votre assistant d'apprentissage personnalisé",
      welcomeMsg: "Commencez une conversation dans le cadre ci-joint...",
      categoryLabel: "Catégorie :",
      languageLabel: "Langue :",
      math: "Mathématiques",
      physics: "Physique",
      svt: "SVT",
      literature: "Littérature Camerounaise",
      it: "Informatique",
      french: "🇫🇷 Français",
      english: "🇬🇧 English",
      questionLabel: "Votre question :",
      questionPlaceholder: "Posez votre question ici...",
      sendBtn: "Envoyer",
      footer: "Votre compagnon DeepSeek AI pour vous aider dans vos études."
    },
    en: {
      title: "Educational AI Chat",
      subtitle: "Your personalized learning assistant",
      welcomeMsg: "Start a conversation in the frame below...",
      categoryLabel: "Category:",
      languageLabel: "Language:",
      math: "Mathematics",
      physics: "Physics",
      svt: "Life Sciences",
      literature: "Cameroonian Literature",
      it: "Computer Science",
      french: "🇫🇷 French",
      english: "🇬🇧 English",
      questionLabel: "Your question:",
      questionPlaceholder: "Ask your question here...",
      sendBtn: "Send",
      footer: "Your DeepSeek AI companion to help you with your studies."
    }
  };

  // Fonction pour changer la langue
  function changeLanguage(lang) {
    // Mettre à jour les boutons actifs
    document.getElementById('btnFr').classList.toggle('active', lang === 'fr');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    
    // Mettre à jour tous les textes avec data-translate
    document.querySelectorAll('[data-translate]').forEach(element => {
      const key = element.getAttribute('data-translate');
      if (translations[lang][key]) {
        element.textContent = translations[lang][key];
      }
    });

    // Mettre à jour les options des selects
    document.querySelectorAll('[data-translate-option]').forEach(option => {
      const key = option.getAttribute('data-translate-option');
      if (translations[lang][key]) {
        option.textContent = translations[lang][key];
      }
    });
    
    // Mettre à jour le placeholder
    const promptInput = document.getElementById('prompt');
    const placeholderKey = promptInput.getAttribute('data-translate-placeholder');
    if (placeholderKey && translations[lang][placeholderKey]) {
      promptInput.placeholder = translations[lang][placeholderKey];
    }
    
    // Mettre à jour l'attribut lang du HTML
    document.documentElement.lang = lang;
    
    // Sauvegarder la préférence
    localStorage.setItem('preferredLanguage', lang);
  }

  // Charger la langue préférée au démarrage
  window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('preferredLanguage');
    if (savedLang && (savedLang === 'fr' || savedLang === 'en')) {
      changeLanguage(savedLang);
    }
  });
</script>

<script type="module" src="../js/ai/deepseek.js"></script>

<script type="module">
  import { protectPage } from "../js/utils/guards.js";
  protectPage(["student", "teacher"]);
</script>

</body>
</html>
