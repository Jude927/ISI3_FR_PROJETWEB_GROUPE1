<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation - Djangou</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-amber-50">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 bg-white shadow-sm z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="p-2 hover:bg-gray-100 rounded-lg">
                    <span class="material-icons-round">arrow_back</span>
                </button>
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img id="tutor-avatar" src="/assets/avatars/avatardef.png" class="w-12 h-12 rounded-full object-cover border-2 border-orange-300"/>
                        <span id="status-dot" class="absolute bottom-0 right-0 w-3 h-3 bg-gray-400 border-2 border-white rounded-full"></span>
                    </div>
                    <div>
                        <h1 id="tutor-name" class="font-bold text-base">Chargement...</h1>
                        <p id="status-text" class="text-xs text-gray-500">Hors ligne</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="audio-call-btn" class="p-2 hover:bg-orange-100 rounded-lg text-orange-600">
                    <span class="material-icons-round">call</span>
                </button>
                <button id="video-call-btn" class="p-2 hover:bg-orange-100 rounded-lg text-orange-600">
                    <span class="material-icons-round">videocam</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MESSAGES -->
    <main class="pt-24 pb-24 px-4">
        <div class="max-w-4xl mx-auto">
            <div id="messages-container" class="space-y-3 min-h-[60vh]">
                <div class="text-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mx-auto mb-3"></div>
                    <p class="text-gray-600 font-medium">Chargement des messages...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- BARRE ENVOI -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
            <button id="file-btn" class="p-2 text-gray-600 hover:text-orange-600">
                <span class="material-icons-round">attach_file</span>
            </button>
            <textarea id="message-input" rows="1" placeholder="Écrivez votre message..." class="flex-1 resize-none bg-gray-100 border-0 rounded-2xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 max-h-32"></textarea>
            <button id="voice-btn" class="p-2 text-gray-600 hover:text-orange-600">
                <span class="material-icons-round">mic</span>
            </button>
            <button id="send-btn" class="p-3 bg-orange-500 hover:bg-orange-600 text-white rounded-full shadow-lg transition-all hover:scale-105">
                <span class="material-icons-round">send</span>
            </button>
        </div>
    </footer>

    <script type="module" src="/js/conversation-logic-FINAL.js"></script>

</body>
</html>
