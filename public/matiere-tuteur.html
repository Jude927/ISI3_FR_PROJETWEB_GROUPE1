<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Djangou - Tableau de Bord Tuteur</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <style type="text/tailwindcss">
        :root {
            /* Palette pql.jpg */
            --p-dark-teal: #0D1D25;
            --p-accent-orange: #D59D80;
            --p-deep-brown: #B6410F;
            
            --bg-body: #FFFDF5;
            --bg-sidebar: #FFFFFF;
            --text-main: #0D1D25; 
            --border-ui: #E2E8F0;
            --card-maths: #FFE5D9; 
            /* Couleur pour que le bloc ne soit pas trop blanc en mode clair */
            --card-students: #F2F2F7; 
        }

        .dark {
            --bg-body: #050A18;
            --bg-sidebar: #0B1224; /* Sidebar distincte du fond */
            --text-main: #F1F5F9;
            --border-ui: rgba(255,255,255,0.08); 
            --card-maths: #0D1528;
            --card-students: #0F172A; /* Bloc distinct du fond sombre */
        }

        @layer base {
            body {
                @apply font-['Comfortaa'] transition-colors duration-300;
                background-color: var(--bg-body);
                color: var(--text-main);
            }
        }

        .nav-item {
            @apply flex items-center gap-3 px-5 py-3 rounded-[1.5rem] transition-all duration-300 w-full text-slate-500;
        }
        .nav-item.active {
            @apply bg-[var(--p-accent-orange)] text-white font-bold shadow-lg shadow-orange-900/10;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 20px; }
        
        .ai-fab {
            @apply fixed bottom-24 lg:bottom-10 right-6 md:right-10 w-16 h-16 rounded-full bg-[#0A1128] border-2 border-[#D4AF37] flex items-center justify-center shadow-2xl z-50 transition-all hover:scale-110 active:scale-95;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { 'p-orange': "#D59D80", 'p-teal': "#0D1D25" }
                },
            },
        };
    </script>
</head>

<body class="antialiased overflow-hidden h-screen">
    <input class="hidden peer" id="mobile-menu-toggle" type="checkbox" />
    <label class="overlay fixed inset-0 bg-slate-900/20 dark:bg-slate-950/80 backdrop-blur-sm z-[60] hidden"
        for="mobile-menu-toggle"></label>

    <div class="flex h-full w-full relative">
        <aside
            class="fixed inset-y-0 left-0 w-64 flex flex-col py-8 px-5 bg-[var(--bg-sidebar)] lg:m-4 rounded-none lg:rounded-[2.5rem] z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0 h-full lg:h-[calc(100vh-2rem)] border-r border-[var(--border-ui)] lg:border shadow-xl">
            <div class="mb-10 flex items-center gap-4 px-2">
                <img alt="Logo" class="w-10 h-10 rounded-2xl object-cover"
                    src="/assets/d.png" />
                <span class="text-xl font-bold tracking-tight">DJANGOU</span>
                <label class="lg:hidden ml-auto p-2 cursor-pointer" for="mobile-menu-toggle">
                    <span class="material-symbols-outlined">close</span>
                </label>
            </div>
            <nav class="flex flex-col gap-2 flex-1 overflow-y-auto custom-scrollbar">
                <a class="nav-item" href="dashboard-teacher.html"><span
                        class="material-symbols-outlined">grid_view</span><span class="text-[12px]">Tableau de
                        Bord</span></a>
                <a class="nav-item active" href="#"><span class="material-symbols-outlined">auto_stories</span><span
                        class="text-[12px]">Ma Matière</span></a>
                <a class="nav-item" href="messagerie-teacher.html"><span
                        class="material-symbols-outlined">chat_bubble</span><span
                        class="text-[12px]">IA Chat</span></a>
                <a class="nav-item" href="profil-teacher.html"><span
                        class="material-symbols-outlined">person</span><span class="text-[12px]">Mon Profil</span></a>
            </nav>
            <div class="mt-auto pt-6 border-t border-[var(--border-ui)] space-y-2">
                <button class="nav-item" onclick="window.location.href='settings-tuteur.html'"><span
                        class="material-symbols-outlined">settings</span><span
                        class="text-[12px]">Paramètres</span></button>
                <button id="logoutBtn" class="nav-item text-rose-500 font-bold"><span
                        class="material-symbols-outlined">logout</span><span
                        class="text-[12px]">Déconnexion</span></button>
            </div>
        </aside>

        <main
            class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar px-4 py-6 md:px-8 lg:pl-[19rem] lg:pr-10">
            <header class="flex items-center justify-between gap-4 mb-8">

                <div class="flex items-center gap-5">
                    <button id="logoutBtnMobile"
                        class="lg:hidden w-11 h-11 flex items-center justify-center rounded-2xl border border-[var(--border-ui)] text-rose-500 bg-white dark:bg-slate-800"><span
                            class="material-symbols-outlined">logout</span></button>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold">Matière</h1>
                        <p class="text-slate-400 mt-1 text-xs">Description</p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button id="lang-toggle" class="w-11 h-11 flex items-center justify-center
         rounded-xl border border-[var(--border-ui)]
         bg-white dark:bg-slate-800
         text-lg">
                        🇫🇷
                    </button>
                    <button id="theme-toggle"
                        class="p-2.5 rounded-xl border border-[var(--border-ui)] bg-white dark:bg-slate-800">
                        <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                        <span class="material-symbols-outlined hidden dark:block">light_mode</span>
                    </button>
                    <a href="profil-teacher.html"><img alt="Profile"
                            class="profile-avatar w-10 h-10 rounded-xl object-cover cursor-pointer"
                            src="/assets/avatars/avatardef.png" /></a>
                </div>
            </header>

            <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 mb-28 lg:mb-8">
                <section class="xl:col-span-8 space-y-6">
                    <h2 class="text-lg font-bold">Matière Enseignée</h2>
                    <div class="rounded-[2.5rem] p-8 md:p-12 relative overflow-hidden flex flex-col justify-between min-h-[420px] border border-[var(--border-ui)] shadow-sm"
                        style="background-color: var(--card-maths);">
                        <div class="z-10">

                            <h3 id="subject-text"
                                class="text-3xl md:text-5xl font-bold leading-tight text-slate-900 dark:text-white">
                            </h3>
                            <div class="w-20 h-1.5 bg-[var(--p-accent-orange)] rounded-full my-6"></div>
                            <p id="subject-description"
                                class="text-slate-600 dark:text-slate-400 max-w-md text-sm font-medium">
                                Chargement de la description…
                            </p>

                        </div>

                    </div>
                </section>
            </div>
        </main>

        <button id="ai-fab" class="ai-fab group overflow-hidden p-0 flex items-center justify-center">
            <img src="https://m.thewire.in/sortd-service/imaginary/v22-01/jpg/large/high?url=dGhld2lyZS1pbi1wcm9kLXNvcnRkL21lZGlhZjBmODY5MDAtNGM3ZC0xMWYwLWJmMjMtZjFjNDdiZWUxMTRjLmpwZw=="
                alt="Assistant IA" class="w-full h-full object-cover
           transition-transform duration-300 ease-out
           group-hover:rotate-12
           active:rotate-[360deg]" />
        </button>

        <button id="burger-btn" class="lg:hidden fixed bottom-6 left-5
         w-12 h-12
         rounded-2xl
         backdrop-blur-md
         bg-[var(--bg-sidebar)]/80
         border border-[var(--border-ui)]
         shadow-2xl
         flex items-center justify-center
         z-[100]" aria-label="Menu">
            <span class="material-symbols-outlined text-xl">
                menu
            </span>
        </button>
        <nav id="mobile-nav" class="lg:hidden fixed bottom-4
         left-[4.5rem] right-4
         hidden
         backdrop-blur-md
         bg-[var(--bg-sidebar)]/95
         h-16 rounded-2xl shadow-2xl
         flex items-center justify-around px-6
         z-[40]
         border border-[var(--border-ui)]">
            <a class="flex flex-col items-center gap-1 text-slate-400" href="dashboard-teacher.html">
                <span class="material-symbols-outlined">grid_view</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Accueil</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-[var(--p-accent-orange)]" href="#">
                <span class="material-symbols-outlined">auto_stories</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Cours</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-slate-400" href="messagerie-teacher.html">
                <span class="material-symbols-outlined">chat_bubble</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">IA</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-slate-400" href="profil-teacher.html">
                <span class="material-symbols-outlined">person</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Profil</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-slate-400" href="settings-tuteur.html">
                <span class="material-symbols-outlined">settings</span>
                <span class="text-[8px] font-bold uppercase tracking-widest">Réglages</span>
            </a>
        </nav>
    </div>

    <script src="/js/utils/dark-white.js"></script>
    <script type="module" src="/js/utils/avatar-sync.js"></script>
    <script type="module">
        import { protectPage } from "/js/utils/guards.js";
        protectPage(["teacher"]);
    </script>
    <script type="module" src="/js/utils/IconeIA.js"></script>
    <script src="/js/peer/test.js" defer></script>
    <script type="module" src="/js/utils/subject.js"></script>
    <script type="module">
        import { auth, db } from "/js/auth/firebase-config.js";
        import { loadTeacherConversations } from "/js/ai/history.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        auth.onAuthStateChanged(async (user) => {
            if (!user) return;
            const conversations = await loadTeacherConversations(user.uid);
            const inscrits = document.getElementById("students-count-inscrits");
            if (inscrits) inscrits.textContent = conversations.length;
            const snap = await getDoc(doc(db, "teachers", user.uid));
            if (snap.exists()) {
                document.querySelectorAll("#teacher-name").forEach(el => el.textContent = snap.data().fullName);
            }
        });
    </script>
    <script type="module">
        import { SUBJECT_DESCRIPTIONS } from "/js/utils/sujetdes.js";

        const subjectEl = document.getElementById("subject-text");
        const descEl = document.getElementById("subject-description");

        if (!subjectEl || !descEl) {
            console.error("subject-text ou subject-description introuvable");
        } else {
            const observer = new MutationObserver(() => {
                const subject = subjectEl.textContent.trim();
                if (!subject) return;

                console.log("Matière détectée :", subject);

                descEl.textContent =
                    SUBJECT_DESCRIPTIONS[subject] ||
                    "Description non disponible pour cette matière.";

                observer.disconnect();
            });

            observer.observe(subjectEl, {
                childList: true,
                characterData: true,
                subtree: true
            });
        }
    </script>
<script type="module" src="/js/lang.js"></script>

    <script type="module" src="/js/auth/logout.js"></script>
        <script src="/js/utils/mobile-burger.js"></script>

</body>

</html>
